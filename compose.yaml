name: cv-complex-test

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-integration-test/keycloak/demo-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r response <&3; [[ $$response == *'200 OK'* ]]"
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  api:
    build: ./keycloak-integration-test
    environment:
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/demo
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/demo/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      keycloak:
        condition: service_healthy

  cv:
    build: ./cv-test
    environment:
      CV_DEVICE: cpu
      CV_MODEL_PATH: /app/models/yolo11n.pt
    ports:
      - "127.0.0.1:${CV_PORT:-8000}:8000"
    volumes:
      - model-cache:/app/models

  web:
    build: ./cv-web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
      - cv

volumes:
  keycloak-data:
    name: keycloak-integration-test_keycloak-data
  model-cache:
    name: cv-test_model-cache

