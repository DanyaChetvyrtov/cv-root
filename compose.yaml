name: cv-complex-test

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: employees
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-employees-password}
    volumes:
      - employee-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employees -d employees"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-integration-test/keycloak/demo-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
      - ./keycloak-integration-test/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r response <&3; [[ $$response =~ ^HTTP/[0-9.]+[[:space:]]+200([[:space:]]|$$) ]]"
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  keycloak-init:
    image: python:3.12-slim
    command: ["python", "/setup/scripts/configure_bff.py"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-bff-secret}
      BFF_PUBLIC_URL: http://127.0.0.1:5173
    volumes:
      - ./keycloak-integration-test/scripts:/setup/scripts:ro
      - ./keycloak-integration-test/keycloak:/setup/keycloak:ro
    depends_on:
      keycloak:
        condition: service_healthy

  api:
    build: ./keycloak-integration-test
    restart: unless-stopped
    environment:
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/demo
      KEYCLOAK_INTERNAL_BASE_URI: http://keycloak:8080/realms/demo
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-bff-secret}
      BFF_PUBLIC_URL: http://127.0.0.1:5173
      CV_SERVICE_URL: http://cv:8000
      SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/employees
      DATABASE_USERNAME: employees
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-employees-password}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.5}
      FACE_AMBIGUITY_MARGIN: ${FACE_AMBIGUITY_MARGIN:-0.05}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
        restart: true
      keycloak-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r response <&3; [[ $$response =~ ^HTTP/[0-9.]+[[:space:]]+200([[:space:]]|$$) ]]"
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  cv:
    build: ./cv-test
    restart: unless-stopped
    environment:
      CV_DEVICE: cpu
      CV_MODEL_PATH: /app/models/yolo11n.pt
      CV_FACE_MODELS_PATH: /app/models
    expose:
      - "8000"
    volumes:
      - model-cache:/app/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 36

  web:
    build: ./cv-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true
      cv:
        condition: service_healthy
        restart: true

volumes:
  employee-data:
  # Reuse data created by the earlier standalone module Compose files.
  keycloak-data:
    name: keycloak-integration-test_keycloak-data
  model-cache:
    name: cv-test_model-cache
